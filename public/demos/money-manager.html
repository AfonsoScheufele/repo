<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo — Money Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #eceae6; min-height: 100vh; padding: 1.5rem; }
    header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #1f1f1f; }
    a { color: #d97706; text-decoration: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .card { background: #111; border: 1px solid #1f1f1f; padding: 1rem; max-width: 640px; margin: 0 auto 1rem; }
    .balance { font-size: 1.75rem; color: #d97706; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    td, th { padding: 0.55rem 0; border-bottom: 1px solid #1a1a1a; text-align: left; }
    th { color: #666; font-weight: 400; font-size: 0.7rem; text-transform: uppercase; }
    .pos { color: #22c55e; }
    .neg { color: #ef4444; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    input, button { font-family: inherit; font-size: 0.8rem; padding: 0.45rem 0.6rem; border: 1px solid #333; background: #141414; color: #eceae6; }
    button { background: #d97706; color: #0a0a0a; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-size:0.7rem;color:#d97706;letter-spacing:0.15em;text-transform:uppercase">Demo · Finance</div>
      <strong>Money Manager</strong>
    </div>
    <a href="../">← Portfolio</a>
  </header>
  <div class="card">
    <div style="font-size:0.7rem;color:#666;margin-bottom:0.35rem">SALDO TOTAL</div>
    <div class="balance" id="bal">R$ 12.450,00</div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Descrição</th><th>Valor</th></tr></thead>
      <tbody id="rows">
        <tr><td>Salário</td><td class="pos">+ R$ 2.100,00</td></tr>
        <tr><td>Mercado</td><td class="neg">- R$ 89,90</td></tr>
        <tr><td>Freelance</td><td class="pos">+ R$ 350,00</td></tr>
      </tbody>
    </table>
    <form id="f">
      <input name="desc" placeholder="Descrição" required />
      <input name="val" type="number" step="0.01" placeholder="Valor (+/-)" required />
      <button type="submit">Add</button>
    </form>
  </div>
  <script>
    let balance = 12450;
    const fmt = (n) => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    document.getElementById("f").onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const desc = String(fd.get("desc"));
      const val = Number(fd.get("val"));
      balance += val;
      document.getElementById("bal").textContent = fmt(balance);
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${desc}</td><td class="${val >= 0 ? "pos" : "neg"}">${val >= 0 ? "+" : "-"} ${fmt(Math.abs(val))}</td>`;
      document.getElementById("rows").prepend(tr);
      e.target.reset();
    };
  </script>
</body>
</html>
